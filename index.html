<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />

    <title>LoopBot</title>
    <style>
      /* The splash: the same dusk sky, LoopBot and wordmark as the native launch screen (all drawn from
         scripts/icons/bot.mjs), drawn before
         any code loads, so the hand-off from the phone's splash to the game has no blank moment. */
      html, body { margin: 0; height: 100%; background: #2b2546; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 40%, rgba(127, 242, 224, 0.2), rgba(127, 242, 224, 0) 50vmin),
          linear-gradient(180deg, #2a2445 0%, #3b2e58 45%, #4d3a6a 62%, #a46a76 100%);
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
      #splash.gone { opacity: 0; }
      .reduce-motion #splash { transition: none; }
      #splash svg { width: 30vmin; max-width: 170px; height: auto; }
      #splash p {
        margin: 0; font: 800 clamp(40px, 11vmin, 72px) / 1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.02em; color: #f6f1e6;
      }
      #splash p span { color: #7ff2e0; }
    </style>
  </head>
