name: iOS device build
# Builds an "ad hoc" copy of LoopBot that installs straight onto registered devices from a link,
# without TestFlight. For test devices too old for the TestFlight app (it needs iOS 16; LoopBot runs on 15.4+).
# Run it by hand: Actions tab > "iOS device build" > Run workflow. Download the LoopBot-ipa artifact when it finishes.
#
# Before the first run, register each device's UDID at developer.apple.com > Devices.
# Uses the same repository secrets as the iOS TestFlight workflow (VITE_REVENUECAT_IOS_KEY too, for sandbox purchases). Xcode makes the ad hoc profile
# itself and puts every registered device in it, so register a new device, then run this again.
on:
  workflow_dispatch:
    inputs:
      plus_preview:
        description: Unlock Frostline and other Plus content without buying (VITE_PLUS_PREVIEW). Test builds only, never for the App Store release.
        type: boolean
        default: true
      plus_store:
        description: Turn the store on (VITE_PLUS) - Plus, the Heatwave and Twist city packs and hint packs. Leave off until they are on sale.
        type: boolean
        default: true

jobs:
  adhoc:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_API_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Build the game
        env:
          VITE_TELEMETRY_URL: ${{ secrets.VITE_TELEMETRY_URL }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_PLUS_PREVIEW: ${{ inputs.plus_preview && '1' || '' }}
          VITE_PLUS: ${{ inputs.plus_store && '1' || '' }}
        run: |
          echo "Plus preview: ${VITE_PLUS_PREVIEW:-off}, Plus store: ${VITE_PLUS:-off}, RevenueCat key: $([ -n "$VITE_REVENUECAT_IOS_KEY" ] && echo set || echo missing)"
          npm ci
          npm run ios:sync

      - name: Archive and export an ad hoc IPA
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_API_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$P8" > "$KEY_PATH"
          VERSION=$(node -p "require('./package.json').version")
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER")

          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LoopBot.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="0.$BUILD_NUMBER" \
            "${AUTH[@]}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LoopBot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"

          rm -f "$KEY_PATH"
          mv "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/LoopBot-$VERSION-adhoc-$BUILD_NUMBER.ipa"
          {
            echo "### LoopBot $VERSION ad hoc build $BUILD_NUMBER"
            echo "Download the LoopBot-ipa artifact below, unzip it, and install the .ipa on a registered device (see the iOS launch guide)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LoopBot-ipa
          path: ${{ runner.temp }}/LoopBot-*.ipa
          retention-days: 14
