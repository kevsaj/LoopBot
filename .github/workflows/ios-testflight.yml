name: iOS TestFlight
# Builds a signed release on a GitHub macOS runner and uploads it to App Store Connect,
# so LoopBot can ship to iPhone without owning a Mac.
# Run it by hand: Actions tab > "iOS TestFlight" > Run workflow.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID                 10-character Team ID (developer.apple.com > Account > Membership details)
#   ASC_KEY_ID                    App Store Connect API key id (Users and Access > Integrations > App Store Connect API)
#   ASC_ISSUER_ID                 Issuer ID shown on that same page
#   ASC_API_KEY_P8                Full text of the AuthKey_XXXX.p8 file, including the BEGIN/END lines
#   VITE_TELEMETRY_URL (optional) Playtest stats endpoint, same value as in .env.local
#   VITE_REVENUECAT_IOS_KEY (optional) RevenueCat public Apple SDK key (appl_...), needed for Plus purchases
# The API key needs the Admin role so Xcode can create the distribution certificate and profile itself.
on:
  workflow_dispatch:
    inputs:
      plus_preview:
        description: Unlock Frostline and other Plus content without buying (VITE_PLUS_PREVIEW). Test builds only, never for the App Store release.
        type: boolean
        default: false
      plus_store:
        description: Turn the store on (VITE_PLUS) - Plus, the Heatwave city pack and hint packs. Leave off until they are on sale.
        type: boolean
        default: false
      notes:
        description: What testers should try in this build (shown in the run summary only)
        required: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_API_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Build the game
        env:
          VITE_TELEMETRY_URL: ${{ secrets.VITE_TELEMETRY_URL }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_PLUS_PREVIEW: ${{ inputs.plus_preview && '1' || '' }}
          VITE_PLUS: ${{ inputs.plus_store && '1' || '' }}
        run: |
          echo "Plus preview: ${VITE_PLUS_PREVIEW:-off}, Plus store: ${VITE_PLUS:-off}, RevenueCat key: $([ -n "$VITE_REVENUECAT_IOS_KEY" ] && echo set || echo missing)"
          npm ci
          npm run ios:sync

      - name: Archive and upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_API_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}
          NOTES: ${{ inputs.notes }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$P8" > "$KEY_PATH"
          VERSION=$(node -p "require('./package.json').version")
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER")

          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LoopBot.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LoopBot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"

          rm -f "$KEY_PATH"
          {
            echo "### Uploaded LoopBot $VERSION ($BUILD_NUMBER) to App Store Connect"
            echo "It shows up in TestFlight after Apple finishes processing, usually 10 to 30 minutes."
            if [ -n "$NOTES" ]; then echo ""; echo "Notes: $NOTES"; fi
          } >> "$GITHUB_STEP_SUMMARY"
