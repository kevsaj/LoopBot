name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # simulation tests + level checks LV-1 to LV-3
      - run: npx vite build
      - run: npx vite build --mode demo --outDir dist-demo --emptyOutDir # the itch.io demo still builds

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # The debug APK can play Plus content (Frostline) without buying it, for testing on a phone.
      - run: npm run cap:sync
        env:
          VITE_PLUS_PREVIEW: '1'
          VITE_MAKER: '1'
      # Debug APK to sideload on a phone, and an unsigned release bundle to prove the Play build works.
      - run: node scripts/gradle.mjs assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: loopbot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    # Proves the Xcode project compiles. Unsigned simulator build, so it needs no Apple secrets.
    # macOS runners are free on public repos.
    # Xcode 27 (iOS 27 SDK) only ships on GitHub's xcode-27 image (macOS 27); macos-26 tops out at Xcode 26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the iOS SDK is 27 or newer
        # Apple requires the iOS 27 SDK (Xcode 27) for uploads from April 2027 (ITMS-90725).
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 27 ]; then echo "::error::Built with iOS SDK $SDK, Apple needs 27 or newer"; exit 1; fi
      - run: npm ci
      - run: npm run ios:sync
      - run: >
          xcodebuild build
          -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
