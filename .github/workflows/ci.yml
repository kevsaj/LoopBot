name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # simulation tests + level checks LV-1 to LV-3
      - run: npx vite build
      - run: npx vite build --mode demo --outDir dist-demo --emptyOutDir # the itch.io demo still builds
